<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Bank Demo - Login</title>
    <style>
      body{font-family:system-ui,Arial;margin:40px}
      form{max-width:420px}
      input,button{display:block;margin:8px 0;padding:8px;width:100%}
    </style>
  </head>
  <body>
    <h1>Bank Demo — Register / Login</h1>
    <form id="authForm">
      <input id="name" placeholder="Full name" />
      <input id="phone" placeholder="Phone number" />
      <input id="password" type="password" placeholder="Password" />
      <button id="register" type="button">Register</button>
      <button id="login" type="button">Login</button>
    </form>
    <pre id="out"></pre>

    <script>
      const out = document.getElementById('out');
      function show(obj){ out.textContent = JSON.stringify(obj, null, 2); }

      async function post(path, body){
        const res = await fetch(path, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
        const data = await res.json();
        return { status: res.status, data };
      }

      document.getElementById('register').onclick = async () => {
        const name = document.getElementById('name').value;
        const phone = document.getElementById('phone').value;
        const password = document.getElementById('password').value;
        const r = await post('/register', { name, phone, password });
        show(r);
      };

      document.getElementById('login').onclick = async () => {
        const phone = document.getElementById('phone').value;
        const password = document.getElementById('password').value;
        const r = await post('/login', { phone, password });
        show(r);
        if (r.status === 200 && r.data.token){
          localStorage.setItem('demo_token', r.data.token);
        }
      };
    </script>
  </body>
</html>
