<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <style>
      .stroke { stroke: #FFFFFF; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .node { fill: #FFFFFF; }
      .ring { fill: none; stroke: #FFFFFF; stroke-width: 2; }
      .letter { fill: #FFFFFF; font-family: Arial, sans-serif; font-size: 36px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>

  <!-- Hexagon: 6 lines connecting the 6 vertex nodes -->
  <line class="stroke" x1="60" y1="16" x2="98" y2="38" />
  <line class="stroke" x1="98" y1="38" x2="98" y2="82" />
  <line class="stroke" x1="98" y1="82" x2="60" y2="104" />
  <line class="stroke" x1="60" y1="104" x2="22" y2="82" />
  <line class="stroke" x1="22" y1="82" x2="22" y2="38" />
  <line class="stroke" x1="22" y1="38" x2="60" y2="16" />

  <!-- 6 radial lines from center to each vertex -->
  <line class="stroke" x1="60" y1="60" x2="60" y2="16" />
  <line class="stroke" x1="60" y1="60" x2="98" y2="38" />
  <line class="stroke" x1="60" y1="60" x2="98" y2="82" />
  <line class="stroke" x1="60" y1="60" x2="60" y2="104" />
  <line class="stroke" x1="60" y1="60" x2="22" y2="82" />
  <line class="stroke" x1="60" y1="60" x2="22" y2="38" />

  <!-- 6 solid white circles at hexagon vertices -->
  <circle class="node" cx="60" cy="16" r="4" />
  <circle class="node" cx="98" cy="38" r="4" />
  <circle class="node" cx="98" cy="82" r="4" />
  <circle class="node" cx="60" cy="104" r="4" />
  <circle class="node" cx="22" cy="82" r="4" />
  <circle class="node" cx="22" cy="38" r="4" />

  <!-- Central white circle outline with B inside -->
  <circle class="ring" cx="60" cy="60" r="24" />
  <text class="letter" x="60" y="60">B</text>
</svg>
